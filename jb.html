<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PS4 13.xx Exploit By OGH</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0d0e15 url('background.jpg') no-repeat center center fixed;
        background-size: cover;
        color: #ffffff;
        font: bold 15px/1.45 "Segoe UI", system-ui, sans-serif;
        text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.8);
      }
      #brand {
        text-align: center;
        padding: 12px 10px;
        background: rgba(14, 17, 22, 0.85);
        border-bottom: 2px solid #3a3f58;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }
      #brand b {
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 0.14em;
        color: #00d2ff;
        vertical-align: middle;
      }

      /* Logo animé (300% avec contour néon) */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 180px;
        height: 180px;
        margin: -90px 0 0 -90px;
        background: url('logo.png') no-repeat center center;
        background-size: 85%;
        border: 4px solid #00d2ff;
        border-radius: 50%;
        box-sizing: border-box;
        animation: spin 1.2s linear infinite;
        filter: drop-shadow(0 0 15px #00d2ff) drop-shadow(0 0 30px rgba(0, 210, 255, 0.6));
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.5px;
        color: #ff3333;
        text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
        display: none;
        z-index: 10;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      /* ==========================================================================
         Écrans de Succès et d'Échec du Jailbreak
         ========================================================================== */
      
      /* Quand le Jailbreak réussit (body.done) */
      body.done {
        background: #000000 url('success.jpg') no-repeat center center fixed !important;
        background-size: cover !important;
      }
      body.done #spin, 
      body.done #brand, 
      body.done #wrap, 
      body.done #msg {
        display: none !important;
      }

      /* Quand le Jailbreak échoue (body.fail) */
      body.fail {
        background: #000000 url('failed.jpg') no-repeat center center fixed !important;
        background-size: cover !important;
      }
      body.fail #spin, 
      body.fail #brand, 
      body.fail #wrap,
      body.fail #msg {
        display: none !important; /* Masque tout pour afficher uniquement failed.jpg */
      }

      /* Mode Débug (?log=1) */
      body.log #spin, body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 20px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 900;
        margin: 0 0 12px;
        color: #00d2ff;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: bold 13px/1.5 Consolas, monospace;
        background: rgba(17, 21, 27, 0.88);
        border: 1px solid #2a2d3d;
        border-radius: 8px;
        padding: 15px;
        height: calc(100vh - 160px);
        overflow-y: auto;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      .ok { color: #00ff66 !important; font-weight: 900; text-shadow: 0 0 8px rgba(0,255,102,0.4); }
      .bad { color: #ff3333 !important; font-weight: 900; text-shadow: 0 0 8px rgba(255,51,51,0.4); }
      .warn { color: #ffcc00 !important; font-weight: 900; text-shadow: 0 0 8px rgba(255,204,0,0.4); }
      .safe { color: #00ff66 !important; font-weight: 900; }
      .danger { color: #ff3333 !important; font-weight: 900; }
      code { color: #a2b7d4; font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="brand">
      <b>RAW GAME X OGH</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
